name: 'Run Reviews'
description: 'Run AI reviews with the OpenCode CLI'
inputs:
  github-token:
    description: 'Token forwarded to the action. Used for fetching prior AI review comments and forwarded to the validator.'
    required: false
    default: ''
  opencode-version:
    description: 'Expected OpenCode version installed on PATH'
    required: false
    default: '1.18.5'
  debug:
    description: 'Capture, redact, and gzip OpenCode stdout and stderr'
    required: false
    default: 'false'
  model:
    description: 'OpenCode model in provider/model format'
    required: false
    default: 'anthropic/claude-sonnet-4.6'
  models:
    description: 'Comma-separated OpenCode models; overrides model when set'
    required: false
    default: ''
  prompts:
    description: 'Comma-separated prompt sources using file: or text: prefixes'
    required: true
  opencode-config:
    description: 'Path to a user-provided OpenCode config'
    required: false
  permission:
    description: 'JSON object defining OpenCode tool permissions'
    required: false
  timeout-minutes:
    description: 'Timeout for each OpenCode invocation'
    required: false
    default: '30'
  fusion:
    description: 'Synthesize successful reviews into one result'
    required: false
    default: 'false'
  fusion-model:
    description: 'Model used for fusion; defaults to the first effective model'
    required: false
    default: ''
  fail-on-error:
    description: 'Fail the action when any review fails'
    required: false
    default: 'false'
outputs:
  review:
    description: 'The review text output'
  models-used:
    description: 'Comma-separated list of models that completed successfully'
  cost:
    description: 'Total cost in USD'
  cost-by-model:
    description: 'JSON object containing cost by model'
  tokens:
    description: 'JSON object containing total input and output tokens'
  tokens-by-model:
    description: 'JSON object containing token usage by model'
  debug-artifact-path:
    description: 'Directory containing redacted, gzipped debug output when debug is enabled'
  review-output-path:
    description: 'Runner-local path to the authoritative review markdown file written by the action from a validated model response'
  config-json:
    description: 'Deterministic JSON serialization of a validator-only OpenCode config. Contains the resolved providers (built-in and user-supplied, with secret-bearing fields redacted), the effective first model, the deny-all validator permission, and a single agent.validator definition. The config carries a __validator__: true marker and does NOT include agent.review, agent.synthesis, or any prompt that embeds reviewOutputPath.'
  effective-model:
    description: 'The effective first model (provider/model format) selected from the inputs.model or inputs.models list. Downstream actions should pass this to the validator as the model input.'
  failure-reason:
    description: 'Latest failure message produced by the action (empty on success). Captures both pre-document failures (all invocations failed or returned invalid documents) and post-document failures (file write/read errors).'
runs:
  using: node24
  main: dist/main.cjs