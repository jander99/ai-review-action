name: 'Run Reviews'
description: 'Run AI reviews on the decision-API pipeline'
inputs:
  github-token:
    description: 'Token used to fetch prior AI review comments. Needs pull-requests: read.'
    required: false
    default: ''
  prompts:
    description: 'Comma-separated prompt sources using file: or text: prefixes'
    required: true
  llm-provider:
    description: 'Proposing LLM provider (openai, anthropic, gemini)'
    required: true
  llm-base-url:
    description: 'Override the LLM provider base URL'
    required: false
    default: ''
  llm-model:
    description: 'Model id for the proposing LLM'
    required: true
  llm-api-key:
    description: 'API key for the proposing LLM'
    required: true
  decision-provider:
    description: 'Decision provider used to judge findings (systemone, google)'
    required: true
  decision-base-url:
    description: 'Override the decision provider base URL'
    required: false
    default: ''
  decision-model:
    description: 'Model id for the judging decision API'
    required: true
  decision-api-key:
    description: 'API key for the decision provider'
    required: true
  keep-threshold:
    description: 'Minimum support probability to keep a finding'
    required: false
    default: '0.7'
  drop-threshold:
    description: 'Maximum support probability to drop a finding'
    required: false
    default: '0.3'
  severity-threshold:
    description: 'Judge severity below this is treated as a suggestion'
    required: false
    default: '0.5'
outputs:
  review:
    description: 'The rendered review document (markdown)'
  triage:
    description: 'One-line triage of the pull request (empty when skipped)'
  review-output-path:
    description: 'Runner-local path to the review document written by the action'
  findings-kept:
    description: 'Findings kept after judging and policy'
  findings-uncertain:
    description: 'Findings in the uncertain band (not posted inline)'
  findings-dropped:
    description: 'Findings dropped as unsupported, duplicate, or below threshold'
  tokens:
    description: 'JSON object of token usage: { llmInput, llmOutput, decisionInput }'
  failure-reason:
    description: 'Canonical failure message (empty on success)'
runs:
  using: node24
  main: dist/main.cjs
