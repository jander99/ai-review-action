name: 'AI Review'
description: >-
  AI-powered repository reviews. An LLM proposes findings from the diff and a
  decision-API judge scores each one, so only supported findings are kept.
  Requires `pull-requests: write` for pull_request events and `checks: write`
  for non-PR events (push, workflow_dispatch).
author: 'jander99'

branding:
  icon: eye
  color: blue

inputs:
  github-token:
    description: >-
      GITHUB_TOKEN or fine-grained PAT for posting results (falls back to
      github.token when omitted). Requires `pull-requests: write` for
      pull_request events and `checks: write` for non-PR events.
    required: false
  prompts:
    description: 'Comma-separated prompt sources using file: or text: prefixes.'
    required: true
  llm-provider:
    description: 'LLM provider (see the README for the supported providers).'
    required: true
  llm-base-url:
    description: 'Override the provider base URL (e.g. for a compatible gateway).'
    required: false
    default: ''
  llm-model:
    description: 'Model id for the proposing LLM.'
    required: true
  llm-api-key:
    description: 'API key for the proposing LLM.'
    required: true
  decision-provider:
    description: 'Decision provider used to judge findings (see the README).'
    required: true
  decision-base-url:
    description: 'Override the decision provider base URL.'
    required: false
    default: ''
  decision-model:
    description: 'Model id for the judging decision API.'
    required: true
  decision-api-key:
    description: 'API key for the decision provider.'
    required: true
  keep-threshold:
    description: 'Minimum support probability for a finding to be kept (0 < keep <= 1).'
    required: false
    default: '0.7'
  drop-threshold:
    description: 'Maximum support probability for a finding to be dropped; between the two it is uncertain (0 <= drop < keep).'
    required: false
    default: '0.3'
  severity-threshold:
    description: 'Judge severity below this is treated as a suggestion rather than a warning.'
    required: false
    default: '0.5'
  review-event:
    description: >-
      Review event for PR events: COMMENT, REQUEST_CHANGES or APPROVE. Only
      COMMENT is used by default; REQUEST_CHANGES/APPROVE need the matching
      token permissions.
    required: false
    default: 'COMMENT'
  post-comment:
    description: >-
      Post the review to the PR (pull_request events only). Set to false to
      only expose outputs.
    required: false
    default: 'true'
  post-check-run:
    description: >-
      Post the review as a check run (non-PR events only). Set to false to
      only expose outputs.
    required: false
    default: 'true'
  max-comment-chars:
    description: >-
      Truncate the PR review body at this many characters. GitHub hard-limits
      comments to 65536 characters.
    required: false
    default: '65000'
  check-name:
    description: 'Name of the check run created on non-PR events.'
    required: false
    default: 'ai-review'
  check-conclusion:
    description: >-
      Conclusion of the check run created on non-PR events. One of:
      action_required, cancelled, failure, neutral, success, skipped,
      stale, timed_out.
    required: false
    default: 'neutral'
  check-details-url:
    description: 'URL linked from the check run details on non-PR events.'
    required: false
    default: 'https://github.com'

outputs:
  review:
    description: >-
      The rendered review document (markdown). Empty when the run produced
      nothing to review; see `failure-reason` on failure.
  triage:
    description: 'The one-line triage of the pull request (empty when triage was skipped).'
  comment-url:
    description: >-
      URL of the posted PR review (pull_request events). Empty when
      post-comment is false, on non-PR events, or when publication failed.
  check-run-url:
    description: >-
      URL of the created check run (non-PR events). Empty on pull_request
      events or when post-check-run is false.
  review-output-path:
    description: 'Runner-local path to the review document written by the action.'
  findings-kept:
    description: 'Number of findings kept after judging and policy.'
  findings-uncertain:
    description: 'Number of findings in the uncertain band (not posted inline).'
  findings-dropped:
    description: 'Number of findings dropped (unsupported, duplicates or below threshold).'
  tokens:
    description: 'JSON object of token usage: { llmInput, llmOutput, decisionInput }.'
  failure-reason:
    description: >-
      Canonical failure message (empty on success). Single source of truth for
      every failure the pipeline reports.

runs:
  using: node24
  main: dist/main.cjs
