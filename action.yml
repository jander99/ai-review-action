---
name: AI Review
description: >-
  AI-powered repository reviews using the OpenCode CLI with user-provided
  models and prompts. OpenCode must be installed first with the standalone
  setup-opencode action. This action requires `pull-requests: write` for
  pull_request events and `checks: write` for non-PR events (push,
  workflow_dispatch).
author: 'jander99'

branding:
  icon: eye
  color: blue

inputs:
  opencode-version:
    description: 'OpenCode version expected to already be installed on PATH.'
    required: false
    default: '1.18.5'
  debug:
    description: 'Capture redacted, gzipped OpenCode stdout and stderr as an artifact.'
    required: false
    default: 'false'
  github-token:
    description: >-
      GITHUB_TOKEN or fine-grained PAT for posting results (falls back to
      github.token when omitted). Run setup-opencode as a separate workflow
      step before this action. Requires `pull-requests: write` for
      pull_request events and `checks: write` for non-PR events.
    required: false
  model:
    description: 'OpenCode model in provider/model format.'
    required: false
    default: 'anthropic/claude-sonnet-4.6'
  models:
    description: 'Comma-separated OpenCode models; overrides model when set.'
    required: false
    default: ''
  prompts:
    description: 'Comma-separated prompt sources using file: or text: prefixes.'
    required: true
  opencode-config:
    description: 'Path to a user-provided OpenCode config.'
    required: false
  permission:
    description: 'JSON object defining OpenCode tool permissions.'
    required: false
  timeout-minutes:
    description: 'Timeout for each OpenCode invocation.'
    required: false
    default: '30'
  fusion:
    description: 'Synthesize successful reviews into one result.'
    required: false
    default: 'false'
  fusion-model:
    description: 'Model used for fusion; defaults to the first effective model.'
    required: false
    default: ''
  fail-on-error:
    description: 'Exit non-zero when any review fails.'
    required: false
    default: 'false'
  post-comment:
    description: >-
      Post the review as a PR comment (pull_request events only). Set to
      false to only expose outputs without commenting.
    required: false
    default: 'true'
  post-check-run:
    description: >-
      Post the review as a check run (non-PR events only). Set to false
      to only expose outputs without publishing.
    required: false
    default: 'true'
  max-comment-chars:
    description: >-
      Truncate the PR comment at this many characters. GitHub hard-limits
      comments to 65536 characters.
    required: false
    default: '65000'
  check-name:
    description: 'Name of the check run created on non-PR events.'
    required: false
    default: 'ai-review'
  check-conclusion:
    description: >-
      Conclusion of the check run created on non-PR events. One of:
      action_required, cancelled, failure, neutral, success, skipped,
      stale, timed_out. Default neutral. Future iterations may derive
      this from the review severity (deferred).
    required: false
    default: 'neutral'
  check-details-url:
    description: 'URL linked from the check run details on non-PR events.'
    required: false
    default: 'https://github.com'

outputs:
  review:
    description: >-
      Synthesized review text when fusion is enabled and successful; otherwise
      all successful individual reviews labeled '<model> :: <prompt>' and
      separated by '---'. Empty when no reviews succeeded.
    value: ${{ steps.run.outputs.review }}
  comment-url:
    description: >-
      URL of the posted PR comment (pull_request events). Empty when
      post-comment is false, when permissions were insufficient, or on
      non-PR events.
    value: ${{ steps.post-comment.outputs.comment-url }}
  check-run-url:
    description: >-
      URL of the created check run (push, workflow_dispatch, and other
      non-pull_request events). Empty on pull_request events.
    value: ${{ steps.post-check-run.outputs.check-run-url }}
  models-used:
    description: 'Comma-separated list of models that completed successfully.'
    value: ${{ steps.run.outputs.models-used }}
  cost:
    description: 'Total cost in USD.'
    value: ${{ steps.run.outputs.cost }}
  cost-by-model:
    description: 'JSON object containing cost by model.'
    value: ${{ steps.run.outputs.cost-by-model }}
  tokens:
    description: 'JSON object containing total input and output tokens.'
    value: ${{ steps.run.outputs.tokens }}
  tokens-by-model:
    description: 'JSON object containing token usage by model.'
    value: ${{ steps.run.outputs.tokens-by-model }}
  debug-artifact-path:
    description: 'Directory containing redacted, gzipped debug output when debug is enabled.'
    value: ${{ steps.run.outputs.debug-artifact-path }}

runs:
  using: composite
  steps:
    - name: Run reviews
      id: run
      uses: ./packages/run-reviews
      with:
        opencode-version: ${{ inputs.opencode-version }}
        debug: ${{ inputs.debug }}
        model: ${{ inputs.model }}
        models: ${{ inputs.models }}
        prompts: ${{ inputs.prompts }}
        opencode-config: ${{ inputs.opencode-config }}
        permission: ${{ inputs.permission }}
        timeout-minutes: ${{ inputs.timeout-minutes }}
        fusion: ${{ inputs.fusion }}
        fusion-model: ${{ inputs.fusion-model }}
        fail-on-error: ${{ inputs.fail-on-error }}

    - name: Post comment
      if: always() && github.event_name == 'pull_request'
      id: post-comment
      uses: ./packages/post-comment
      with:
        github-token: ${{ inputs.github-token || github.token }}
        review: ${{ steps.run.outputs.review }}
        post-comment: ${{ inputs.post-comment }}
        max-comment-chars: ${{ inputs.max-comment-chars }}

    - name: Post check run
      if: always() && github.event_name != 'pull_request' && inputs.post-check-run == 'true'
      id: post-check-run
      uses: ./packages/post-check-run
      with:
        github-token: ${{ inputs.github-token || github.token }}
        review: ${{ steps.run.outputs.review }}
        name: ${{ inputs.check-name }}
        conclusion: ${{ inputs.check-conclusion }}
        details-url: ${{ inputs.check-details-url }}

    - name: Upload debug artifact
      if: always() && inputs.debug == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ai-review-debug
        path: ${{ steps.run.outputs.debug-artifact-path }}
        retention-days: 7
        if-no-files-found: warn