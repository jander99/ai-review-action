---
name: Copilot Review
description: >-
  AI-powered pull request reviews using the GitHub Copilot CLI, supporting
  multiple models and prompt strategies.
author: 'jander99'

branding:
  icon: eye
  color: blue

inputs:
  github-token:
    description: >-
      GITHUB_TOKEN or fine-grained PAT for posting PR comments (falls back to
      github.token when omitted; requires pull-requests: write permission).
    required: false
  copilot-token:
    description: >-
      Fine-grained PAT with "Copilot Requests" permission. Classic PATs
      (ghp_) are NOT supported by the Copilot CLI.
    required: true
  models:
    description: >-
      Comma-separated list of models to run sequentially. Each model is called
      once per prompt.
    required: false
    default: 'claude-sonnet-4.6'
  prompts:
    description: >-
      Comma-separated list of built-in prompt names (code-review,
      security-review, dependency-review, test-coverage) or workspace-relative
      file paths to run sequentially.
    required: false
    default: 'code-review'
  fusion:
    description: >-
      Run a synthesis pass combining all individual reviews into one coherent
      summary.
    required: false
    default: 'false'
  fusion-model:
    description: >-
      Single model for the fusion synthesis pass. Inherits first entry of
      models when empty. Must be a single model name, not a list.
    required: false
    default: ''
  post-comment:
    description: >-
      Post the review as a PR comment. Set to false to only expose outputs
      without commenting.
    required: false
    default: 'true'
  allow-all-tools:
    description: 'Pass --yolo to copilot CLI (grants full tool access). Default: false'
    required: false
    default: 'false'
  min-prompt-length:
    description: >-
      Minimum character length for the PR diff. Reviews are skipped when the
      diff is smaller than this value.
    required: false
    default: '50'
  fail-on-error:
    description: >-
      Exit with a non-zero status if all reviews fail. When false (default),
      the action always exits successfully even if no reviews ran.
    required: false
    default: 'false'
  max-comment-chars:
    description: >-
      Truncate the PR comment at this many characters. GitHub hard-limits
      comments to 65536 characters.
    required: false
    default: '65000'

outputs:
  review:
    description: >-
      Full review text from the last model/prompt combination, or the fusion
      review if fusion is enabled.
    value: ${{ steps.run.outputs.review }}
  comment-url:
    description: >-
      URL of the posted PR comment. Empty when post-comment is false or when
      permissions were insufficient.
    value: ${{ steps.post.outputs.comment-url }}
  models-used:
    description: >-
      Comma-separated list of models that completed their reviews successfully.
    value: ${{ steps.run.outputs.models-used }}

runs:
  using: composite
  steps:
    - name: Install GitHub CLI
      shell: bash
      run: |
        if command -v gh &>/dev/null; then
          echo "gh CLI already available: $(gh --version | head -1)" >&2
          exit 0
        fi
        echo "gh CLI not found; installing from GitHub releases..." >&2
        case "$(uname -m)" in
          x86_64)  gh_arch=amd64 ;;
          aarch64) gh_arch=arm64 ;;
          armv*)   gh_arch=arm   ;;
          *)       echo "ERROR: Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
        esac
        gh_version=$(curl -sf 'https://api.github.com/repos/cli/cli/releases/latest' \
          | grep '"tag_name"' | head -1 | sed 's/.*"v\([^"]*\)".*/\1/')
        if [[ -z "${gh_version}" ]]; then
          echo "ERROR: Could not determine latest gh CLI version" >&2
          exit 1
        fi
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        curl -fsSL \
          "https://github.com/cli/cli/releases/download/v${gh_version}/gh_${gh_version}_linux_${gh_arch}.tar.gz" \
          | tar -xz -C "$tmp"
        gh_bin="$tmp/gh_${gh_version}_linux_${gh_arch}/bin/gh"
        if sudo install -m 755 "$gh_bin" /usr/local/bin/gh 2>/dev/null; then
          echo "gh ${gh_version} installed to /usr/local/bin" >&2
        else
          mkdir -p "$HOME/.local/bin"
          install -m 755 "$gh_bin" "$HOME/.local/bin/gh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "gh ${gh_version} installed to $HOME/.local/bin" >&2
        fi

    - name: Install Copilot CLI
      shell: bash
      run: |
        npm install -g @github/copilot@1.0.37

    - name: Make scripts executable
      shell: bash
      run: |
        chmod +x "${{ github.action_path }}/scripts/run-reviews.sh"
        chmod +x "${{ github.action_path }}/scripts/post-comment.sh"

    - name: Run Copilot reviews
      id: run
      shell: bash
      env:
        COPILOT_GITHUB_TOKEN: >-
          ${{ inputs.copilot-token }}
        COPILOT_AUTO_UPDATE: 'false'
        INPUT_MODELS: >-
          ${{ inputs.models }}
        INPUT_PROMPTS: >-
          ${{ inputs.prompts }}
        INPUT_FUSION: >-
          ${{ inputs.fusion }}
        INPUT_FUSION_MODEL: >-
          ${{ inputs.fusion-model }}
        INPUT_ALLOW_ALL_TOOLS: >-
          ${{ inputs.allow-all-tools }}
        INPUT_MIN_PROMPT_LENGTH: >-
          ${{ inputs.min-prompt-length }}
        INPUT_FAIL_ON_ERROR: >-
          ${{ inputs.fail-on-error }}
        GITHUB_BASE_SHA: >-
          ${{ github.event.pull_request.base.sha }}
      run: |
        "${{ github.action_path }}/scripts/run-reviews.sh"

    - name: Post PR comment
      id: post
      shell: bash
      env:
        GH_TOKEN: >-
          ${{ inputs.github-token || github.token }}
        INPUT_POST_COMMENT: >-
          ${{ inputs.post-comment }}
        INPUT_MAX_COMMENT_CHARS: >-
          ${{ inputs.max-comment-chars }}
        GITHUB_PR_NUMBER: >-
          ${{ github.event.pull_request.number }}
      run: |
        "${{ github.action_path }}/scripts/post-comment.sh"
