name: Dist sync

# Renovate bumps dependencies but cannot rebuild the committed dist/ bundles
# (CI skips the dist-drift check on renovate/* PRs). After a merge, rebuild
# and commit any drift straight to main. Pushes made with GITHUB_TOKEN do not
# trigger further workflow runs, so this cannot loop.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: dist-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Rebuild dist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: |
          yarn nx run-many --target=build --skip-nx-cache
          yarn nx run repo-root:build --skip-nx-cache

      - name: Commit dist changes
        run: |
          set -euo pipefail
          git add -- dist packages/*/dist
          if git diff --cached --quiet; then
            echo "dist/ is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: rebuild dist bundles"
          git push origin HEAD:main
