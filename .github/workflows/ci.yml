name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn nx run-many --target=build --skip-nx-cache

      - name: Build repo-root dist
        # Fix 3 of the Phase-3 bounded remediation: build the
        # repository-root `dist/main.cjs` so consumers can reference
        # `jander99/ai-review-action@v1` directly.
        run: yarn nx run repo-root:build --skip-nx-cache

      - name: Build run-reviews test bundle
        run: yarn nx run run-reviews:build-tests --skip-nx-cache

      - name: Build setup-opencode test bundle
        run: yarn nx run setup-opencode:build-tests --skip-nx-cache

      - name: Check dist is up to date
        run: |
          set -euo pipefail
          # Phase 3: the root action is a single JS bundle under
          # packages/root-action/dist/. The composite `./packages/*`
          # references in the old action.yml are gone. Each leaf also
          # ships a `dist-test/index.cjs` used by its test target; those
          # are checked separately below.
          tracked=(
            "dist/main.cjs"
            "packages/root-action/dist/main.cjs"
            "packages/run-reviews/dist/main.cjs"
            "packages/run-reviews/dist-test/index.cjs"
            "packages/validate-review/dist/main.cjs"
            "packages/validate-review/dist-test/index.cjs"
            "packages/setup-opencode/dist/main.cjs"
            "packages/setup-opencode/dist-test/index.cjs"
            "packages/post-comment/dist/main.cjs"
            "packages/post-comment/dist-test/index.cjs"
            "packages/post-check-run/dist/main.cjs"
            "packages/post-check-run/dist-test/index.cjs"
            "packages/post-error-comment/dist/main.cjs"
            "packages/post-error-comment/dist-test/index.cjs"
            "packages/review-contract/dist/index.cjs"
            "packages/previous-reviews/dist/index.cjs"
          )
          if ! git diff --exit-code "${tracked[@]}"; then
            echo "::error::dist/ is out of sync. Run 'yarn build' locally and commit the result."
            exit 1
          fi
          if git status --porcelain -- "${tracked[@]}" | grep -q .; then
            echo "::error::Untracked files in dist/. Run 'yarn build' locally and commit all dist outputs."
            exit 1
          fi

      - name: Verify every dist bundle is tracked
        run: |
          set -euo pipefail
          # Fix 11 of the Phase-3 bounded remediation: every
          # packages/*/dist/main.cjs and packages/*/dist-test/index.cjs
          # that exists must be tracked in git; otherwise the action
          # reference will fail under remote invocation because the
          # runner never sees the file.
          missing=0
          for dist in $(find packages dist -path '*/dist*/main.cjs' -o -path '*/dist*/index.cjs' -o -path 'dist/main.cjs' 2>/dev/null); do
            if [ ! -f "$dist" ]; then
              continue
            fi
            if ! git ls-files --error-unmatch -- "$dist" >/dev/null 2>&1; then
              echo "::error::Untracked dist file: $dist"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::At least one dist file is not tracked. Commit it."
            exit 1
          fi

      - name: Verify root-action dist is portable
        run: |
          set -euo pipefail
          # Sanity-check that the root-action bundle parses, exposes
          # the package APIs, and does NOT trigger leaf side effects
          # on require. A consumer invoking the action as
          # owner/repo@ref uses exactly this dist file.
          # Use plain CJS (no --input-type=module) so require() works.
          node -e "
            const fs = require('fs');
            const dist = 'packages/root-action/dist/main.cjs';
            const size = fs.statSync(dist).size;
            if (size < 10000) {
              console.error('root-action dist looks suspiciously small (' + size + ' bytes)');
              process.exit(1);
            }
            const exports = require('./' + dist);
            const required = ['runReviews', 'validateReview', 'postComment', 'postCheckRun', 'postErrorComment'];
            for (const name of required) {
              if (typeof exports[name] !== 'function') {
                console.error('root-action dist must export ' + name + ' as a function');
                process.exit(1);
              }
            }
            console.log('root-action dist size: ' + size + ' bytes; exports OK');
          "

      - name: Verify repo-root dist is portable
        run: |
          set -euo pipefail
          # Fix 3 of the Phase-3 bounded remediation: the repository-
          # root `dist/main.cjs` is what consumers see when they
          # reference `owner/repo@v1`. It must be at least 10 KB and
          # expose the wired package APIs.
          node -e "
            const fs = require('fs');
            const dist = 'dist/main.cjs';
            const size = fs.statSync(dist).size;
            if (size < 10000) {
              console.error('repo-root dist looks suspiciously small (' + size + ' bytes)');
              process.exit(1);
            }
            const exports = require('./' + dist);
            const required = ['runReviews', 'validateReview', 'postComment', 'postCheckRun', 'postErrorComment'];
            for (const name of required) {
              if (typeof exports[name] !== 'function') {
                console.error('repo-root dist must export ' + name + ' as a function');
                process.exit(1);
              }
            }
            console.log('repo-root dist size: ' + size + ' bytes; exports OK');
          "

      - name: Verify executable-mode consistency for tracked dist bundles
        run: |
          set -euo pipefail
          # Project memory #157 historically recommended 100755 but the
          # actual tracked mode across all packages is 100644. We
          # assert against the actual convention so a stray 100755
          # entry does not break the check.
          expected_mode="100644"
          bad=0
          for dist in $(git ls-files 'dist/main.cjs' 'packages/*/dist*/main.cjs' 'packages/*/dist*/index.cjs'); do
            mode=$(git ls-files -s -- "$dist" | awk '{print $1}')
            if [ "$mode" != "$expected_mode" ]; then
              echo "::warning::$dist has mode $mode (expected $expected_mode)"
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "::error::Some tracked dist bundles have an unexpected mode. See warnings above."
            exit 1
          fi