name: Copilot Review

on:
  workflow_dispatch:
    inputs:
      models:
        description: 'Model(s) to use (comma-separated, e.g. claude-sonnet-4.6)'
        required: false
        default: 'claude-sonnet-4.6'
        type: string
      prompts:
        description: 'Prompt(s) to use (comma-separated, e.g. code-review,security-review)'
        required: false
        default: 'code-review,security-review'
        type: string
      allow-all-tools:
        description: 'Allow all tools'
        required: false
        default: false
        type: boolean
      post-comment:
        description: 'Post comments on PR'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write

jobs:
  copilot-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Copilot Review
        uses: ./
        with:
          # COPILOT_TOKEN must be a fine-grained PAT with "Copilot Requests" permission.
          # Classic PATs (ghp_...) are NOT supported by the Copilot CLI.
          copilot-token: ${{ secrets.COPILOT_TOKEN }}
          models: ${{ inputs.models }}
          prompts: ${{ inputs.prompts }}
          allow-all-tools: ${{ inputs['allow-all-tools'] }}
          post-comment: ${{ inputs['post-comment'] }}
