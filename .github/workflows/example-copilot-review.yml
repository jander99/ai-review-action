name: Copilot Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

# SECURITY NOTE: Do NOT change this trigger to a base-branch privileged event.
# That would run with elevated permissions and could expose your copilot-token to untrusted fork PR code.

permissions:
  contents: read
  pull-requests: write

jobs:
  copilot-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Copilot Review
        uses: ./
        with:
          # COPILOT_TOKEN must be a fine-grained PAT with "Copilot Requests" permission.
          # Classic PATs (ghp_...) are NOT supported by the Copilot CLI.
          copilot-token: ${{ secrets.COPILOT_TOKEN }}
          models: claude-sonnet-4.6
          prompts: code-review,security-review
          allow-all-tools: false
          post-comment: true
