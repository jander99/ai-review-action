name: AI Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'examples/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup OpenCode
        uses: jander99/ai-review-action/packages/setup-opencode@56d52daeabff9081ca6dee756f595f208feb86b6
        with:
          version: 1.18.5
          checksum: cd4a2557a3d6550f27cb5c0257ebe8d73388bb34beda8b6121e6428a74c1eae2

      - name: AI Review
        uses: jander99/ai-review-action@56d52daeabff9081ca6dee756f595f208feb86b6
        with:
          model: minimax/minimax-m3
          prompts: file:examples/prompts/code-review.md
          fusion: false
          debug: false
          fail-on-error: false
          post-comment: true
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
