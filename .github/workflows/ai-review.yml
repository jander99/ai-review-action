name: AI Review

on:
  # Disabled on pull requests until the version 2 decision-review design is
  # built: the v1 review path needs a paid model and currently fails on
  # provider errors (402 insufficient balance), which only reddens PRs.
  # Re-enable by restoring the pull_request trigger below.
  workflow_dispatch:
  # pull_request:
  #   types:
  #     - opened
  #     - synchronize
  #     - reopened
  #     - ready_for_review
  #   paths-ignore:
  #     - '**/*.md'
  #     - 'docs/**'
  #     - 'examples/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: AI Review
        id: review
        uses: ./packages/root-action
        with:
          # A single LLM generates the review; a decision model judges each
          # finding against the keep/drop policy.
          llm-provider: openai
          llm-base-url: https://api.subq.ai/v1
          llm-model: subq-savant-1.4
          decision-provider: systemone
          decision-base-url: https://api.subq.ai
          decision-model: subq-snap-1.2
          prompts: file:examples/prompts/code-review.md,file:examples/prompts/security-review.md
          post-comment: true
          github-token: ${{ github.token }}
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          decision-api-key: ${{ secrets.DECISION_API_KEY }}
