name: AI Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: AI Code Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # @v1 is convenient for this example. Pin both project actions to the
      # same full commit SHA in production.
      - name: Setup OpenCode
        uses: jander99/ai-review-action/setup-opencode@v1
        with:
          version: 1.18.4
          checksum: ${{ vars.OPENCODE_1_18_4_SHA256 }}

      - name: Run reviews
        uses: jander99/ai-review-action@v1
        with:
          model: anthropic/claude-sonnet-4.6
          prompts: file:.github/prompts/code-review.md
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
